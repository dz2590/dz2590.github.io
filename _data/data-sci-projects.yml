- name: Post-ICU Myocardial Infarction Risk Prediction
  url: https://github.com/dz2590/healthcare-ml
  code: https://github.com/dz2590/healthcare-ml
  description: Final project for BINF 4008 - Machine Learning for Healthcare. Built and evaluated survival machine learning models using MIMIC-IV data to predict time to first myocardial infarction amongst post-ICU discharge patients.
    Constructed patient cohort; conducted EDA and feature engineering; trained, tuned, and tested baseline cox, elastic net cox, random survival forest, and
    gradient boosting models. Validated and assessed results using calibration, Kaplan-Meier risk stratification, hazard ratio interpretation, and subgroup performance analyses. 
  used: 
    - thing: Python
    - thing: Exploratory Data Analysis
    - thing: Feature Engineering
    - thing: Supervised Learning 
    - thing: Survival Analysis Modeling (scikit-survival, lifelines)
    - thing: Google BigQuery (GoogleSQL)

- name: IBM Job Salary Prediction and Workforce Analytics
  url: https://github.com/Trigger-chen/5243-project4
  code: https://github.com/Trigger-chen/5243-project4
  description: Group project for STAT 5243 - Advanced Data Science and Artificial Intelligence. Built end-to-end salary analytics and prediction pipeline using web scraped IBM job posting data. 
    Performed exploratory data analysis, feature engineering, unsupervised modeling, and supervised modeling to identify key compensation drivers and predict salary using features such as role,
    seniority level, education level, geographic location, and technical skill requirements.
  used:
    - thing: Python
    - thing: Selenium
    - thing: Pandas
    - thing: Scikit-learn
    - thing: NLP
    - thing: PCA
    - thing: Clustering
    - thing: Shiny

- name: Identifying Restaurant Market Opportunities in California
  url:
  code:
  description: Analyzing Yelp restaurant data paired with U.S. Census demographic data across California to explore how restaurant characteristics, local competition, cuisine availability, and
    neighborhood demographics relate to customer ratings and engagement. The main objetive is to identify underserved restaurant categories within each zip code and determine what types of restaurant concepts
    can yield the largest market opportunity. Currently a work in progress. 
  used:
  - thing: Pandas, Numpy
  - thing: Scikit-learn
  - thing: Matplotlib
  - thing: Kaggle
  - thing: U.S. Census API
  - thing: Exploratory Data Analysis
  - thing: Feature Engineering


