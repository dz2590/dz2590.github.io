- name: Adaptive Dynamic Pricing with Demand Learning and Revenue Optimization
  url: https://github.com/dz2590/dynamic-pricing
  code: https://github.com/dz2590/dynamic-pricing
  description: Project for IEOR 4601 Dynamic Pricing course. Built a three-phase dynamic pricing strategy that learns customer demand and responds to changing
    competitor prices using systematic price exploration, Thompson Sampling under demand uncertainty, Histogram Gradient Boosting, and kernel-based demand
    estimation. Evaluates candidate prices and selects the one with the highest predicted revenue to offer to customers. 
  used:
    - thing: Python 
    - thing: SciPy
    - thing: Scikit-learn
    - thing: Thompson Sampling
    - thing: Gradient Boosting

- name: Columbia University Microtransit Shuttle Optimization
  url: https://github.com/dz2590/night-shuttle-route-opti
  code: https://github.com/dz2590/night-shuttle-route-opti
  description: Project for IEOR 4418 Transportation Analytics course. Developed a dynamic batching and vehicle routing framework to optimize 
    Columbia's nighttime shuttle service. The system batches ride requests, assigns them to available shuttles, and uses mixed integer programming
    (Traveling Salesman) to optimize pick up and drop off routes. Conducted sensitivity analyses to evaluate how batching intervals and fleet
    availability affect passenger wait times and service performance. 
  used:
    - thing: Python
    - thing: Gurobi 
    - thing: NetworkX
    - thing: OSMnx
    - thing: Shapely
    - thing: Matplotlib
    - thing: Mixed Integer Programming
    - thing: Vehicle Routing

- name: New York Child Care Desert Optimization 
  url: https://github.com/dz2590/childcare-opti
  code: https://github.com/dz2590/childcare-opti
  description: Project for IEOR 4004 Optimization Models and Methods course. Built mixed integer optimization model to allocate childcare funding across New York State by selecting
    new facility construction and existing center expansions. Incorporated demographic demand, age specific capacity requirements, piecewise expansion costs, and geographic spacing constraints
    to eliminate child care deserts at minimum total cost.
  used:
    - thing: Python 
    - thing: Gurobi
    - thing: Geopy
    - thing: Integer and Mixed-Integer Programming

- name: Sterile Processing Department Quality Assurance and Resource
    Allocation 
  url: /18 Piedmont Atlanta SPD Hospital Final Report.pdf
  code: /18 Piedmont Atlanta SPD Hospital Final Report.pdf
  description: Improved hospital sterile processing operations by (1) designing and piloting a tray quality assurance checklist and (2) building a Simio simulation model to optimize surgical
    tray inventory and technician staffing levels. Final recommendations reduced surgery delays by 5%, improved surgical tray assembly fill rates up to 99%, and supported overall capacity planning 
    to improve patient health outcomes and reduce surgery costs. 
  used: 
    - thing: Simio
    - thing: OptQuest
    - thing: Excel
    - thing: Discrete-Event Simulation
    - thing: Exploratory Data Analysis
    - thing: Process Improvement
    - thing: Quality Assurance
    - thing: Capacity Planning

